apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: user-cclyburn
  labels:
    app.kubernetes.io/part-of: data-agents
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: data-agents
    spec:
      containers:
        - name: frontend
          image: image-registry.openshift-image-registry.svc:5000/user-cclyburn/frontend:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: user-cclyburn
  labels:
    app.kubernetes.io/part-of: data-agents
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/component: frontend
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: data-agents-ui
  namespace: user-cclyburn
  labels:
    app.kubernetes.io/part-of: data-agents
spec:
  to:
    kind: Service
    name: frontend
  port:
    targetPort: 3000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
