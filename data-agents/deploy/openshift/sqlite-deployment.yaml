apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sqlite-data
  namespace: data-agents-demo
  labels:
    app.kubernetes.io/part-of: data-agents
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: database-init
  namespace: data-agents-demo
  labels:
    app.kubernetes.io/part-of: data-agents
    app.kubernetes.io/component: database
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/component: database
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-db
          image: image-registry.openshift-image-registry.svc:5000/data-agents-demo/database:latest
          env:
            - name: SQLITE_DB_PATH
              value: /data/residential_energy.db
          volumeMounts:
            - name: sqlite-data
              mountPath: /data
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: sqlite-data
