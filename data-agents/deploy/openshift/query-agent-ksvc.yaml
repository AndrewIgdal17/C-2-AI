apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-agent
  namespace: user-cclyburn
  labels:
    app.kubernetes.io/part-of: data-agents
    app.kubernetes.io/component: query-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: query-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/component: query-agent
        app.kubernetes.io/part-of: data-agents
    spec:
      containers:
        - name: query-agent
          image: image-registry.openshift-image-registry.svc:5000/user-cclyburn/query-agent:latest
          ports:
            - containerPort: 8003
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: LLM_API_KEY
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: MCP_AUTH_TOKEN
            - name: SQLITE_DB_PATH
              value: /data/residential_energy.db
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8003"
          envFrom:
            - configMapRef:
                name: agent-config
          volumeMounts:
            - name: sqlite-data
              mountPath: /data
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: sqlite-data
---
apiVersion: v1
kind: Service
metadata:
  name: query-agent
  namespace: user-cclyburn
  labels:
    app.kubernetes.io/part-of: data-agents
    app.kubernetes.io/component: query-agent
spec:
  selector:
    app.kubernetes.io/component: query-agent
  ports:
    - port: 8003
      targetPort: 8003
      protocol: TCP
