apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: query-agent
  namespace: data-agents-demo
  labels:
    app.kubernetes.io/part-of: data-agents
    app.kubernetes.io/component: query-agent
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "3"
        autoscaling.knative.dev/scale-down-delay: "60s"
    spec:
      containers:
        - image: image-registry.openshift-image-registry.svc:5000/data-agents-demo/query-agent:latest
          ports:
            - containerPort: 8003
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: LLM_API_KEY
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: MCP_AUTH_TOKEN
            - name: SQLITE_DB_PATH
              value: /data/residential_energy.db
            - name: MCP_HOST
              value: "0.0.0.0"
            - name: MCP_PORT
              value: "8003"
          envFrom:
            - configMapRef:
                name: agent-config
          volumeMounts:
            - name: sqlite-data
              mountPath: /data
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: sqlite-data
