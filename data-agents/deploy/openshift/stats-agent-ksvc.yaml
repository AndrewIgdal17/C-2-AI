apiVersion: apps/v1
kind: Deployment
metadata:
  name: statistics-agent
  namespace: user-cclyburn
  labels:
    app.kubernetes.io/part-of: data-agents
    app.kubernetes.io/component: statistics-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: statistics-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/component: statistics-agent
        app.kubernetes.io/part-of: data-agents
    spec:
      containers:
        - name: statistics-agent
          image: image-registry.openshift-image-registry.svc:5000/user-cclyburn/statistics-agent:latest
          ports:
            - containerPort: 8001
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: LLM_API_KEY
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: MCP_AUTH_TOKEN
            - name: QUERY_AGENT_MCP_URL
              value: "http://query-agent.user-cclyburn.svc.cluster.local:8003/mcp"
          envFrom:
            - configMapRef:
                name: agent-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: statistics-agent
  namespace: user-cclyburn
  labels:
    app.kubernetes.io/part-of: data-agents
    app.kubernetes.io/component: statistics-agent
spec:
  selector:
    app.kubernetes.io/component: statistics-agent
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
