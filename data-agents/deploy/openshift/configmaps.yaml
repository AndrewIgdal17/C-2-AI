apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: data-agents-demo
  labels:
    app.kubernetes.io/part-of: data-agents
data:
  LLM_API_BASE: "https://litellm-litemaas.apps.prod.rhoai.rh-aiservices-bu.com/v1"
  LLM_MODEL: "Qwen3.6-35B-A3B"
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.data-agents-demo.svc.cluster.local:4317"
  GRAFANA_URL: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: data-agents-demo
  labels:
    app.kubernetes.io/part-of: data-agents
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 5s
        send_batch_size: 1024
    exporters:
      otlp/tempo:
        endpoint: tempo.data-agents-demo.svc.cluster.local:4317
        tls:
          insecure: true
      logging:
        loglevel: info
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/tempo, logging]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: data-agents-demo
  labels:
    app.kubernetes.io/part-of: data-agents
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
    storage:
      trace:
        backend: local
        local:
          path: /tmp/tempo/blocks
    ingester:
      trace_idle_period: 10s
      max_block_bytes: 1048576
      max_block_duration: 5m
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: data-agents-demo
  labels:
    app.kubernetes.io/part-of: data-agents
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo.data-agents-demo.svc.cluster.local:3200
        isDefault: true
        editable: true
        jsonData:
          nodeGraph:
            enabled: true
          search:
            hide: false
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards/json
          foldersFromFilesStructure: false
