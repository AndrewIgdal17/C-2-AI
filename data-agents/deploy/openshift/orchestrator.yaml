apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: user-cclyburn
  labels:
    app.kubernetes.io/part-of: data-agents
    app.kubernetes.io/component: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/component: orchestrator
        app.kubernetes.io/part-of: data-agents
    spec:
      containers:
        - name: orchestrator
          image: image-registry.openshift-image-registry.svc:5000/user-cclyburn/orchestrator:latest
          ports:
            - containerPort: 8000
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: LLM_API_KEY
            - name: STATS_AGENT_URL
              value: "http://statistics-agent.user-cclyburn.svc.cluster.local:8001"
            - name: VIZ_AGENT_URL
              value: "http://visualization-agent.user-cclyburn.svc.cluster.local:8002"
            - name: GRAFANA_URL
              value: "https://grafana-user-cclyburn.apps.ocp.cloud.rhai-tmm.dev"
          envFrom:
            - configMapRef:
                name: agent-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: user-cclyburn
  labels:
    app.kubernetes.io/part-of: data-agents
    app.kubernetes.io/component: orchestrator
spec:
  selector:
    app.kubernetes.io/component: orchestrator
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: orchestrator
  namespace: user-cclyburn
  labels:
    app.kubernetes.io/part-of: data-agents
spec:
  to:
    kind: Service
    name: orchestrator
  port:
    targetPort: 8000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
