<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Residential Electrification Data Explorer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/style.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@sgratzl/chartjs-chart-boxplot@4.4.5/build/index.umd.min.js"></script>
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <div class="nav-brand">
                <svg class="nav-logo" width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M3 3h7v7H3V3Zm11 0h7v7h-7V3ZM3 14h7v7H3v-7Zm14 0a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                </svg>
                <span class="nav-title">Data Explorer</span>
                <span class="nav-badge">Beta</span>
            </div>
            <a id="grafana-link" href="#" target="_blank" class="nav-action" title="View traces in Grafana">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                Traces
            </a>
        </div>
    </nav>

    <main id="chat-container">
        <div id="messages">
            <div class="message system-message">
                <div class="message-content">
                    <div class="welcome-header">
                        <h2>Residential Electrification Data Explorer</h2>
                        <p class="welcome-sub">Ask natural language questions about residential building energy data. Try one of these to get started:</p>
                    </div>
                    <div class="example-categories">
                        <button class="category-btn" data-category="building-stock" onclick="toggleCategory('building-stock')">Building Stock</button>
                        <button class="category-btn" data-category="occupants" onclick="toggleCategory('occupants')">Occupants</button>
                        <button class="category-btn" data-category="fuel-use" onclick="toggleCategory('fuel-use')">Fuel Use</button>
                        <button class="category-btn" data-category="end-use" onclick="toggleCategory('end-use')">End Use</button>
                        <button class="category-btn" data-category="economics" onclick="toggleCategory('economics')">Economics</button>
                    </div>
                    <div class="category-panel" id="panel-building-stock">
                        <button class="example-btn" data-query="What kind of buildings are these?" onclick="askExample(this)"><span class="level">1</span> What kind of buildings are these?</button>
                        <button class="example-btn" data-query="What's the mix of building types, ages, and sizes in this stock?" onclick="askExample(this)"><span class="level">2</span> What's the mix of building types, ages, and sizes in this stock?</button>
                        <button class="example-btn" data-query="Show me the distribution of building types, vintage decades, floor area bins, and stories" onclick="askExample(this)"><span class="level">3</span> Show me the distribution of building types, vintage decades, floor area bins, and stories</button>
                        <button class="example-btn" data-query="Building stock summary for building_type, vintage, floor_area, and stories — count and percentage for each" onclick="askExample(this)"><span class="level">4</span> Building stock summary for building_type, vintage, floor_area, and stories — count and percentage for each</button>
                    </div>
                    <div class="category-panel" id="panel-occupants">
                        <button class="example-btn" data-query="Who lives in these homes?" onclick="askExample(this)"><span class="level">1</span> Who lives in these homes?</button>
                        <button class="example-btn" data-query="How many people live in these buildings and what are their income levels?" onclick="askExample(this)"><span class="level">2</span> How many people live in these buildings and what are their income levels?</button>
                        <button class="example-btn" data-query="What's the distribution of household size, bedroom count, and area median income across the stock?" onclick="askExample(this)"><span class="level">3</span> What's the distribution of household size, bedroom count, and area median income across the stock?</button>
                        <button class="example-btn" data-query="Building stock summary for occupants, bedrooms, and area_median_income — counts and percentages, with AMI ordered from 0-30% to 120-150%" onclick="askExample(this)"><span class="level">4</span> Building stock summary for occupants, bedrooms, and area_median_income — counts and percentages, with AMI ordered from 0-30% to 120-150%</button>
                    </div>
                    <div class="category-panel" id="panel-fuel-use">
                        <button class="example-btn" data-query="What fuels do these homes use?" onclick="askExample(this)"><span class="level">1</span> What fuels do these homes use?</button>
                        <button class="example-btn" data-query="How much electricity vs natural gas vs propane do these buildings consume?" onclick="askExample(this)"><span class="level">2</span> How much electricity vs natural gas vs propane do these buildings consume?</button>
                        <button class="example-btn" data-query="Compare total fuel consumption across electricity, natural gas, propane, and fuel oil — show distributions and break down by heating fuel type" onclick="askExample(this)"><span class="level">3</span> Compare total fuel consumption across electricity, natural gas, propane, and fuel oil — show distributions and break down by heating fuel type</button>
                        <button class="example-btn" data-query="Boxplot of fuel_electricity_total, fuel_natural_gas_total, fuel_propane_total, and fuel_fuel_oil_total grouped by heating_fuel" onclick="askExample(this)"><span class="level">4</span> Boxplot of fuel_electricity_total, fuel_natural_gas_total, fuel_propane_total, and fuel_fuel_oil_total grouped by heating_fuel</button>
                    </div>
                    <div class="category-panel" id="panel-end-use">
                        <button class="example-btn" data-query="Where does the energy actually go?" onclick="askExample(this)"><span class="level">1</span> Where does the energy actually go?</button>
                        <button class="example-btn" data-query="How is energy split between heating, cooling, hot water, and lighting?" onclick="askExample(this)"><span class="level">2</span> How is energy split between heating, cooling, hot water, and lighting?</button>
                        <button class="example-btn" data-query="Compare electricity used for heating vs cooling vs hot water vs lighting — distributions by climate zone" onclick="askExample(this)"><span class="level">3</span> Compare electricity used for heating vs cooling vs hot water vs lighting — distributions by climate zone</button>
                        <button class="example-btn" data-query="Boxplot of end_use_electricity_heating, end_use_electricity_cooling, end_use_electricity_hot_water, and end_use_electricity_lighting grouped by climate_zone" onclick="askExample(this)"><span class="level">4</span> Boxplot of end_use_electricity_heating, end_use_electricity_cooling, end_use_electricity_hot_water, and end_use_electricity_lighting grouped by climate_zone</button>
                    </div>
                    <div class="category-panel" id="panel-economics">
                        <button class="example-btn" data-query="How much does this cost?" onclick="askExample(this)"><span class="level">1</span> How much does this cost?</button>
                        <button class="example-btn" data-query="What does energy cost these households and how does it vary by income?" onclick="askExample(this)"><span class="level">2</span> What does energy cost these households and how does it vary by income?</button>
                        <button class="example-btn" data-query="Estimate annual energy costs using standard fuel rates — how do costs differ between electric and gas homes?" onclick="askExample(this)"><span class="level">3</span> Estimate annual energy costs using standard fuel rates — how do costs differ between electric and gas homes?</button>
                        <button class="example-btn" data-query="Convert energy_use_total to estimated annual cost, compare by heating_fuel and area_median_income — show distributions" onclick="askExample(this)"><span class="level">4</span> Convert energy_use_total to estimated annual cost, compare by heating_fuel and area_median_income — show distributions</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="input-bar">
        <form id="chat-form" onsubmit="handleSubmit(event)">
            <div class="input-wrap">
                <input type="text" id="question-input" placeholder="Ask a question about residential energy data..." autocomplete="off" />
                <button type="submit" id="send-btn" aria-label="Send">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                </button>
            </div>
        </form>
    </footer>

    <script src="app.js"></script>
</body>
</html>
